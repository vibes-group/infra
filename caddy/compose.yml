name: vibes-caddy

networks:
  default:
    name: vibes_net
    external: true

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3.
      - "443:443/udp"
    environment:
      VOICE_HUB_HOST: "${VOICE_HUB_HOST:?VOICE_HUB_HOST is required}"
      SOZVON_HUB_HOST: "${SOZVON_HUB_HOST:?SOZVON_HUB_HOST is required}"
      CURRENCY_HUB_HOST: "${CURRENCY_HUB_HOST:?CURRENCY_HUB_HOST is required}"
      OTS_HOST: "${OTS_HOST:?OTS_HOST is required}"
      # host:port that ACME challenges the webroot cannot answer are passed to; empty on a
      # host that relays nothing. See the :80 site in the Caddyfile.
      ACME_RELAY_UPSTREAM: "${ACME_RELAY_UPSTREAM:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - /opt/vibes/web:/srv/web:ro
      - /var/www/acme:/srv/acme:ro
    security_opt:
      - no-new-privileges:true
